<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GATE SQUARE | 管理者ページ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,"Noto Sans JP",sans-serif}
header{background:#10233f;color:white;padding:20px}
.header-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
main{max-width:1200px;margin:25px auto;padding:0 15px 60px}
.panel{background:white;border:1px solid #dbe3ee;border-radius:14px;padding:22px;margin-bottom:18px}
h1{font-size:25px;margin:0 0 8px}
h2{font-size:19px;margin:0 0 16px}
h3{font-size:16px}
label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}
.primary{background:#2563eb;color:white}
.secondary{background:#e2e8f0;color:#172033}
.danger{background:#fee2e2;color:#b91c1c}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button.active{background:#10233f;color:white}
.tab{display:none}
.tab.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.status{padding:12px;border-radius:8px;margin:12px 0;white-space:pre-wrap}
.status.error{background:#fee2e2;color:#991b1b}
.status.success{background:#dcfce7;color:#166534}
.status.info{background:#dbeafe;color:#1e40af}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0;font-size:13px;vertical-align:top}
th{background:#f8fafc}
.editor-item{border:1px solid #dbe3ee;border-radius:10px;padding:15px;margin:12px 0}
.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .panel{padding:16px}
  .header-inner{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <strong style="font-size:22px;letter-spacing:2px">GATE SQUARE</strong>
      <div>ADMINISTRATION SYSTEM</div>
    </div>
    <button id="logoutButton" class="secondary hidden" onclick="logout()">ログアウト</button>
  </div>
</header>

<main>
<section id="loginPanel" class="panel">
  <h1>管理者ログイン</h1>
  <p>管理者アカウントでログインしてください。</p>
  <label>メールアドレス</label>
  <input id="email" type="email" autocomplete="username">
  <label>パスワード</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="actions">
    <button class="primary" onclick="login()">ログイン</button>
  </div>
  <div id="loginMessage"></div>
</section>

<section id="adminPanel" class="hidden">
  <div class="panel">
    <h1>管理者ダッシュボード</h1>
    <p>アカウント管理とポータルサイトの編集を行えます。</p>
    <div id="adminMessage"></div>
  </div>

  <div class="tabs">
    <button class="secondary active" onclick="showTab('portal',this)">ポータル編集</button>
    <button class="secondary" onclick="showTab('accounts',this)">アカウント管理</button>
  </div>

  <section id="portal" class="tab active">
    <div class="panel">
      <h2>トップページ編集</h2>
      <label>トップタイトル</label>
      <input id="heroTitle">
      <label>トップ説明文</label>
      <textarea id="heroDescription"></textarea>
      <div class="actions">
        <button class="primary" onclick="savePortal()">トップページを保存</button>
        <a href="index.html" target="_blank">ポータルを確認</a>
      </div>
    </div>

    <div class="panel">
      <h2>ニュース・お知らせ編集</h2>
      <div id="newsEditor"></div>
      <button class="secondary" onclick="addItem('news')">＋ お知らせを追加</button>
    </div>

    <div class="panel">
      <h2>事業案内編集</h2>
      <div id="businessEditor"></div>
      <button class="secondary" onclick="addItem('businesses')">＋ 事業を追加</button>
    </div>

    <div class="panel">
      <h2>サービス編集</h2>
      <div id="serviceEditor"></div>
      <button class="secondary" onclick="addItem('services')">＋ サービスを追加</button>
    </div>

    <div class="panel">
      <button class="primary" onclick="savePortal()">すべての変更を保存</button>
    </div>
  </section>

  <section id="accounts" class="tab">
    <div class="panel">
      <h2>アカウント登録・更新</h2>
      <div class="grid">
        <div>
          <label>登録サービス</label>
          <select id="service">
            <option value="kabu">KABU</option>
            <option value="test">オルビステスト</option>
            <option value="admin">オルビステスト管理者</option>
            <option value="tango">TANGO</option>
            <option value="gatesquare_official">GATE SQUARE</option>
          </select>
        </div>
        <div>
          <label>利用者氏名</label>
          <input id="fullName">
        </div>
        <div>
          <label>6桁PIN</label>
          <input id="pin" type="password" inputmode="numeric" maxlength="6">
        </div>
        <div>
          <label>アカウント名</label>
          <input id="accountName">
        </div>
        <div>
          <label>ユーザーID</label>
          <input id="userId">
        </div>
      </div>
      <label>その他の登録情報</label>
      <textarea id="registrationInfo"></textarea>
      <div class="actions">
        <button class="primary" onclick="saveAccount()">登録・更新</button>
        <button class="secondary" onclick="clearAccountForm()">クリア</button>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <h2>登録済みアカウント</h2>
        <button class="secondary" onclick="loadAccounts()">再読み込み</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>サービス</th><th>氏名</th><th>アカウント名</th>
              <th>ユーザーID</th><th>登録情報</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="accountList"></tbody>
        </table>
      </div>
    </div>
  </section>
</section>
</main>

<script>
const SUPABASE_URL="https://hxrtpftlklgwesvanlpk.supabase.co";
const SUPABASE_KEY="sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const DEFAULT_BUSINESSES=[
  {title:"デジタルサービス事業",description:"オンラインサービス・会員向けシステムの企画と運営。"},
  {title:"学習・教育支援事業",description:"オルビステストなどの学習・試験システムの運営。"},
  {title:"会員向けサービス事業",description:"予約・コミュニケーション・各種会員サービスの提供。"}
];

const DEFAULT_SERVICES=[
  {title:"STOCKPOINT",short_title:"KABU",description:"株式売買・ポイント管理ゲーム",url:"https://itzy2.github.io/kabu/"},
  {title:"ORBiS TEST",short_title:"ORBiS",description:"オンライン試験・成績確認",url:"https://itzy2.github.io/test/"},
  {title:"単語学習",short_title:"TANGO",description:"単語学習・語彙力向上サービス",url:"https://itzy2.github.io/tango/"},
  {title:"予約システム",short_title:"RESERVE",description:"会員向け予約・スケジュール管理",url:"https://itzy2.github.io/gatesquare_Official/"},
  {title:"GATE MESSAGE",short_title:"MESSAGE",description:"会員同士のメッセージ機能",url:"https://itzy2.github.io/gatemessage/"},
  {title:"管理者ページ",short_title:"ADMIN",description:"運営・会員・ニュース管理",url:"https://itzy2.github.io/admin.html"}
];

let portalData={
  hero_title:"GATE SQUARE",
  hero_description:"未来につながるサービスを提供します。",
  businesses:DEFAULT_BUSINESSES.map(x=>({...x})),
  services:DEFAULT_SERVICES.map(x=>({...x})),
  news:[]
};

let accounts=[];

function message(id,text,type="info"){
  const el=document.getElementById(id);
  el.className="status "+type;
  el.textContent=text;
}

function showTab(id,button){
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  button.classList.add("active");
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email||!password){
    message("loginMessage","メールアドレスとパスワードを入力してください。","error");
    return;
  }

  const {error}=await db.auth.signInWithPassword({email,password});

  if(error){
    message("loginMessage","ログインできません："+error.message,"error");
    return;
  }

  await checkAdmin();
}

async function checkAdmin(){
  const {data:sessionData}=await db.auth.getSession();

  if(!sessionData.session){
    showLogin();
    return;
  }

  const {data,error}=await db.rpc("gs_admin_is_admin");

  if(error||data!==true){
    await db.auth.signOut();
    showLogin();
    message("loginMessage","管理者権限がありません。","error");
    return;
  }

  document.getElementById("loginPanel").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  document.getElementById("logoutButton").classList.remove("hidden");

  await loadPortal();
  await loadAccounts();
}

function showLogin(){
  document.getElementById("loginPanel").classList.remove("hidden");
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("logoutButton").classList.add("hidden");
}

async function logout(){
  await db.auth.signOut();
  showLogin();
}

function normalizeItems(value){
  return Array.isArray(value)?value:[];
}

function makeField(tag,placeholder,value,type){
  const el=document.createElement(tag);
  if(tag==="input"&&type)el.type=type;
  el.placeholder=placeholder;
  el.value=value??"";
  return el;
}

function renderEditor(type,containerId){
  const box=document.getElementById(containerId);
  box.replaceChildren();

  normalizeItems(portalData[type]).forEach((item,index)=>{
    const div=document.createElement("div");
    div.className="editor-item";

    const title=makeField("input","タイトル",item.title);
    const description=makeField("textarea","説明文",item.description);
    const url=makeField("input","リンクURL（任意）",item.url);

    title.dataset.field="title";
    description.dataset.field="description";
    url.dataset.field="url";

    div.append(title,description,url);

    if(type==="news"){
      const date=makeField("input","掲載日",item.news_date||item.date||"","date");
      const category=makeField("input","カテゴリー",item.category||"お知らせ");

      const color=document.createElement("select");

      [["blue","青"],["green","緑"],["red","赤"]].forEach(([v,t])=>{
        const o=document.createElement("option");
        o.value=v;
        o.textContent=t;
        color.append(o);
      });

      color.value=["blue","green","red"].includes(item.category_color)
        ?item.category_color:"blue";

      const flags=document.createElement("div");
      flags.className="grid";

      const newLabel=document.createElement("label");
      newLabel.textContent="NEW表示";

      const isNew=document.createElement("input");
      isNew.type="checkbox";
      isNew.checked=!!item.is_new;
      newLabel.append(isNew);

      const pubLabel=document.createElement("label");
      pubLabel.textContent="公開する";

      const published=document.createElement("input");
      published.type="checkbox";
      published.checked=item.is_published!==false;
      pubLabel.append(published);

      date.dataset.field="news_date";
      category.dataset.field="category";
      color.dataset.field="category_color";
      isNew.dataset.field="is_new";
      published.dataset.field="is_published";

      div.append(date,category,color,flags);
      flags.append(newLabel,pubLabel);
    }

    const buttons=document.createElement("div");
    buttons.className="item-actions";

    if(type!=="news"){
      const up=document.createElement("button");
      up.className="secondary";
      up.textContent="上へ";
      up.onclick=()=>moveItem(type,index,-1);

      const down=document.createElement("button");
      down.className="secondary";
      down.textContent="下へ";
      down.onclick=()=>moveItem(type,index,1);

      buttons.append(up,down);
    }

    const remove=document.createElement("button");
    remove.className="danger";
    remove.textContent="削除";
    remove.onclick=()=>removeItem(type,index);

    buttons.append(remove);
    div.append(buttons);
    box.append(div);
  });
}

function readEditor(type,containerId){
  return [...document.getElementById(containerId).children].map(div=>{
    const item={};

    div.querySelectorAll("[data-field]").forEach(el=>{
      item[el.dataset.field]=el.type==="checkbox"
        ?el.checked
        :el.value.trim();
    });

    if(type==="news"){
      item.id=div.dataset.id?Number(div.dataset.id):null;
      item.is_new=!!item.is_new;
      item.is_published=!!item.is_published;
    }

    return item;
  });
}

function addItem(type){
  portalData[type]=normalizeItems(portalData[type]);

  portalData[type].push(
    type==="news"
      ?{
        id:null,
        title:"",
        category:"お知らせ",
        category_color:"blue",
        news_date:new Date().toISOString().slice(0,10),
        is_new:false,
        is_published:true
      }
      :{
        title:"",
        description:"",
        url:""
      }
  );

  renderAllEditors();

  if(type==="news"){
    const box=document.getElementById("newsEditor").lastElementChild;
    if(box)box.dataset.id="";
  }
}

async function removeItem(type,index){
  if(!confirm("この項目を削除しますか？"))return;

  const item=portalData[type][index];

  if(type==="news"&&item.id){
    const {error}=await db.from("portal_news").delete().eq("id",item.id);

    if(error){
      message("adminMessage","ニュースを削除できません："+error.message,"error");
      return;
    }
  }

  portalData[type].splice(index,1);
  renderAllEditors();

  message("adminMessage","項目を削除しました。","success");
}

function moveItem(type,index,direction){
  const next=index+direction;

  if(next<0||next>=portalData[type].length)return;

  const list=portalData[type];
  [list[index],list[next]]=[list[next],list[index]];

  renderAllEditors();
}

function renderAllEditors(){
  renderEditor("news","newsEditor");
  renderEditor("businesses","businessEditor");
  renderEditor("services","serviceEditor");

  [...document.getElementById("newsEditor").children].forEach((el,index)=>{
    el.dataset.id=portalData.news[index]?.id??"";
  });
}

async function loadPortal(){
  const {data,error}=await db
    .from("gs_portal_content")
    .select("content_key,content_value");

  if(error){
    message("adminMessage","ポータル情報を読み込めません："+error.message,"error");
    return;
  }

  const values={};
  (data||[]).forEach(row=>{
    values[row.content_key]=row.content_value;
  });

  portalData.hero_title=typeof values.hero_title==="string"
    ?values.hero_title:"GATE SQUARE";

  portalData.hero_description=typeof values.hero_description==="string"
    ?values.hero_description:"未来につながるサービスを提供します。";

  portalData.businesses=Array.isArray(values.businesses)
    ?values.businesses
    :DEFAULT_BUSINESSES.map(x=>({...x}));

  portalData.services=Array.isArray(values.services)
    ?values.services
    :DEFAULT_SERVICES.map(x=>({...x}));

  const {data:news,error:newsError}=await db
    .from("portal_news")
    .select("*")
    .order("news_date",{ascending:false})
    .order("created_at",{ascending:false});

  if(newsError){
    message("adminMessage","ニュースを読み込めません："+newsError.message,"error");
    return;
  }

  portalData.news=(news||[]).map(n=>({
    ...n,
    title:n.title||"",
    description:"",
    url:""
  }));

  document.getElementById("heroTitle").value=portalData.hero_title;
  document.getElementById("heroDescription").value=portalData.hero_description;

  renderAllEditors();
}

async function savePortal(){
  portalData.hero_title=document.getElementById("heroTitle").value.trim();
  portalData.hero_description=document.getElementById("heroDescription").value.trim();

  portalData.businesses=readEditor("businesses","businessEditor");
  portalData.services=readEditor("services","serviceEditor");

  const newsItems=readEditor("news","newsEditor");

  for(const n of newsItems){
    if(!n.title){
      message("adminMessage","ニュースのタイトルを入力してください。","error");
      return;
    }

    const payload={
      title:n.title,
      category:n.category||"お知らせ",
      category_color:["blue","green","red"].includes(n.category_color)
        ?n.category_color:"blue",
      news_date:n.news_date||null,
      is_new:!!n.is_new,
      is_published:!!n.is_published
    };

    const result=n.id
      ?await db.from("portal_news")
        .update({...payload,updated_at:new Date().toISOString()})
        .eq("id",n.id)
      :await db.from("portal_news").insert(payload);

    if(result.error){
      message("adminMessage","ニュースを保存できません："+result.error.message,"error");
      return;
    }
  }

  const rows=[
    {content_key:"hero_title",content_value:portalData.hero_title},
    {content_key:"hero_description",content_value:portalData.hero_description},
    {content_key:"businesses",content_value:portalData.businesses},
    {content_key:"services",content_value:portalData.services}
  ];

  const {error}=await db
    .from("gs_portal_content")
    .upsert(rows,{onConflict:"content_key"});

  if(error){
    message("adminMessage","ポータル情報を保存できません："+error.message,"error");
    return;
  }

  await loadPortal();

  message(
    "adminMessage",
    "変更を保存しました。トップページを再読み込みすると反映されます。",
    "success"
  );
}

const SERVICE_NAMES={
  kabu:"KABU",
  test:"オルビステスト",
  admin:"オルビステスト管理者",
  tango:"TANGO",
  gatesquare_official:"GATE SQUARE"
};

async function loadAccounts(){
  const tbody=document.getElementById("accountList");
  tbody.innerHTML="<tr><td colspan='6'>読み込み中...</td></tr>";

  const {data,error}=await db.rpc("gs_admin_list_accounts");

  if(error){
    tbody.innerHTML="<tr><td colspan='6'>読み込みに失敗しました。</td></tr>";
    message("adminMessage","アカウント一覧の取得に失敗："+error.message,"error");
    return;
  }

  accounts=Array.isArray(data)?data:[];
  tbody.replaceChildren();

  accounts.forEach(account=>{
    const tr=document.createElement("tr");
    const info=account.registration_info||{};

    [
      SERVICE_NAMES[account.service_code]||account.service_code,
      info.name||"未登録",
      account.account_name||"",
      account.user_id||"",
      info.details||""
    ].forEach(value=>{
      const td=document.createElement("td");
      td.textContent=String(value??"");
      tr.appendChild(td);
    });

    const td=document.createElement("td");

    const edit=document.createElement("button");
    edit.className="secondary";
    edit.textContent="編集";
    edit.onclick=()=>editAccount(account.id);

    const del=document.createElement("button");
    del.className="danger";
    del.textContent="削除";
    del.onclick=()=>deleteAccount(account.id);

    td.append(edit,document.createTextNode(" "),del);
    tr.appendChild(td);
    tbody.appendChild(tr);
  });
}

function editAccount(id){
  const a=accounts.find(x=>x.id===id);
  if(!a)return;

  const info=a.registration_info||{};

  document.getElementById("service").value=a.service_code;
  document.getElementById("fullName").value=info.name||"";
  document.getElementById("accountName").value=a.account_name||"";
  document.getElementById("userId").value=a.user_id||"";
  document.getElementById("registrationInfo").value=info.details||"";
  document.getElementById("pin").value="";

  showTab("accounts",document.querySelectorAll(".tabs button")[1]);

  message(
    "adminMessage",
    "編集する情報を入力欄に表示しました。PINは再入力してください。",
    "info"
  );

  window.scrollTo({top:0,behavior:"smooth"});
}

async function saveAccount(){
  const service=document.getElementById("service").value;
  const name=document.getElementById("fullName").value.trim();
  const pin=document.getElementById("pin").value;
  const accountName=document.getElementById("accountName").value.trim();
  const userId=document.getElementById("userId").value.trim();
  const registrationInfo=document.getElementById("registrationInfo").value.trim();

  if(!name||!accountName||!userId){
    message("adminMessage","氏名・アカウント名・ユーザーIDを入力してください。","error");
    return;
  }

  if(!/^[0-9]{6}$/.test(pin)){
    message("adminMessage","PINは数字6桁で入力してください。","error");
    return;
  }

  const {error}=await db.rpc("gs_admin_save_account",{
    p_service_code:service,
    p_name:name,
    p_pin:pin,
    p_account_name:accountName,
    p_user_id:userId,
    p_registration_info:registrationInfo
  });

  if(error){
    message("adminMessage","保存に失敗しました："+error.message,"error");
    return;
  }

  clearAccountForm();
  await loadAccounts();

  message("adminMessage","アカウント情報を保存しました。","success");
}

async function deleteAccount(id){
  if(!confirm("このアカウント情報を削除しますか？"))return;

  const {error}=await db.rpc("gs_admin_delete_account",{p_id:id});

  if(error){
    message("adminMessage","削除できません："+error.message,"error");
    return;
  }

  await loadAccounts();
  message("adminMessage","削除しました。","success");
}

function clearAccountForm(){
  ["fullName","pin","accountName","userId","registrationInfo"].forEach(id=>{
    document.getElementById(id).value="";
  });

  document.getElementById("service").value="kabu";
}

async function initialize(){
  const {data}=await db.auth.getSession();

  if(data.session)await checkAdmin();

  db.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_OUT"||!session)showLogin();
  });
}

initialize();
</script>
