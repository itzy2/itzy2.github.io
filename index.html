<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英単語 書き・読み練習</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fb;--card:#fff;--tx:#1c2430;--sub:#6b7686;--ac:#2f7de1;--ok:#1f9d55;--ng:#d64545;--bd:#dde3ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1e2733;--tx:#e8edf3;--sub:#93a0b2;--ac:#5aa0f5;--ok:#43c37b;--ng:#f07070;--bd:#2f3b4c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;max-width:560px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px;color:var(--sub);flex-wrap:wrap}
select{padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;text-align:center}
.no{font-size:12px;color:var(--sub)}
.jp{font-size:22px;margin:10px 0;font-weight:600}
.ph{font-size:20px;margin:8px 0}
.ph b{color:var(--ac);border-bottom:2px solid var(--ac)}
.big{font-size:40px;font-weight:700;margin:14px 0}
input{width:100%;font-size:22px;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);text-align:center;margin-top:10px}
.row{display:flex;gap:8px;margin-top:12px}
.row button,.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
.pri{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}
.msg{min-height:28px;margin-top:10px;font-size:17px;font-weight:600}
.ok{color:var(--ok)}.ng{color:var(--ng)}
.prog{font-size:13px;color:var(--sub);margin-top:10px;text-align:center}
</style></head><body>
<div class="tabs"><button id="t0">✏️ 書く</button><button id="t1">👀 読む</button><button id="t2">👂 聞いて書く</button></div>
<div class="opt"><select id="sec"></select><label><input type="checkbox" id="weak" style="width:auto;margin:0"> 苦手のみ</label><label><input type="checkbox" id="shuf" checked style="width:auto;margin:0"> ランダム</label><button onclick="speak('Hello, nice to meet you')" style="padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)">🔊 テスト</button><button id="rs" onclick="reset()" style="padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)">🗑 リセット</button></div>
<div class="prog" id="vs"></div>
<div class="card" id="c"></div>
<div class="prog" id="p"></div>
<script>
const D=`0561|自然の力|the power of *nature*
0562|小枝|a small *branch*
0563|野生の花|*wild* flowers
0564|木で造られた家|a house made of *wood*
0565|茂みを見る|see a *bush*
0566|植物に水をやる|water the *plants=plant*
0567|その植物の根|the *root* of the plant
0568|高い波|tall *waves=wave*
0569|天然ガス|natural *gas*
0570|地球という惑星|the *planet* Earth
0571|喜びでいっぱいで|full of *joy*
0572|おもしろがっているように見える|look *amused*
0573|安心を感じる|feel *safe*
0574|夕食後にくつろぐ|*relax* after dinner
0575|全員を感動させる|*impress* everyone
0576|イライラするようになる|grow *nervous*
0577|ショックを受ける|get a *shock*
0578|その知らせに取り乱す|be *upset* by the news
0579|悩みがある|have *trouble*
0580|満員電車が嫌だ|*hate* crowded trains
0611|きれいな空気|clean *air*
0612|低温|a low *temperature*
0613|森林を守る|save the *forest*
0614|新聞を再利用する|*recycle* newspapers
0615|沈黙を守る|keep my *silence*
0616|彼に適している|*suit* him
0617|階段を上る|go up the *stairs=stair*
0618|人体の模型|a *model* of the human body
0619|ねじを回す|turn the *screw*
0620|貝がらを拾う|pick up a *shell*
0621|日記をつける|keep a *diary*
0622|私のイメージをよくする|make my *image* better
0623|食事を用意する|*prepare* food
0624|会社を経営する|run a *company*
0625|制服を着ている|wear her *uniform*
0626|高校を卒業する|*graduate* from high school
0627|大学に通う|go to *university*
0628|平和の象徴|a *symbol* of peace
0629|正門|the front *gate*
0630|警察に行く|go to the *police*
0641|パンを焼く|*bake* bread
0642|木を燃やす|*burn* wood
0643|箱を埋める|*bury* a box
0644|情報を集める|*gather* information
0645|穴の中にボールをころがす|*roll* a ball into a hole
0646|新聞を印刷する|*print* newspapers
0647|窓を閉める|*shut* the window
0648|その仕事を処理する|*handle* the jobs
0649|メッセージを録音する|*record* the message
0650|その壁を破壊する|*destroy* the wall
0651|私の母国|my home *country*
0652|全国紙|a *national* newspaper
0653|日本国民|a Japanese *citizen*
0654|フランスの首都|the *capital* of France
0655|日本政府|the Japanese *government*
0656|成田国際空港|Narita *International* Airport
0657|最初の州|the first *state*
0658|牛乳を生産する|*produce* milk
0659|技能を発達させる|*develop* skills
0660|米の収穫|the rice *harvest*
0661|旅行に出かける|go on a *tour*
0662|外国へ旅行する|travel *abroad*
0663|観光に行く|go *sightseeing*
0664|冒険をする|have an *adventure*
0665|小さな村|a small *village*
0666|美しいながめ|beautiful *views=view*
0667|その博物館を訪れる|visit the *museum*
0668|必要な変更を加える|make *necessary* changes
0669|役に立つ情報|*useful* information
0670|完ぺきな贈りもの|a *perfect* gift
0671|子どもでさえ|*even* a child
0672|スポーツ、特にテニス|sports, *especially* tennis
0673|実際にそこに行く|*actually* go there
0674|そのようなすばらしい日|*such* a wonderful day
0675|とにかく君を信じる|believe you *anyway*
0676|彼を元気づける|*cheer* him up
0677|おもしろい冗談を言う|tell a funny *joke*
0678|友人を夕食に招待する|*invite* a friend to dinner
0679|彼の助言に従う|follow his *advice*
0680|君にお願いをする|ask a *favor* of you`.split("\n").map(l=>{const[n,j,p]=l.split("|");const m=p.match(/\*(.+?)\*/)[1].split("=");return{n,j,form:m[0],w:m[1]||m[0],p:p.replace(/\*.+?\*/,"@")}});
const $=id=>document.getElementById(id);
let mode=0,q=[],i=0,shown=false,done=false,W=new Set();
try{W=new Set(JSON.parse(localStorage.getItem("weak")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("weak",JSON.stringify([...W]))}catch(e){}};
const sec=$("sec");sec.innerHTML='<option value="all">全部 (0561–0680)</option>'+[...new Set(D.map(d=>d.n.slice(0,3)))].map(s=>`<option value="${s}">${s}0–${s}9</option>`).join("");
let VO=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VO=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;$("vs").textContent=VO?"":"⚠️ 英語の音声が見つかりません。端末の設定で英語の読み上げ音声を追加してください"}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert("このブラウザは音声読み上げに対応していません");return}
try{speechSynthesis.cancel();speechSynthesis.resume();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(VO)u.voice=VO;u.rate=.9;speechSynthesis.speak(u)},50)}catch(e){}}
let rt=0;function reset(){const b=$("rs");if(!rt){b.textContent="本当に消す？";rt=setTimeout(()=>{rt=0;b.textContent="🗑 リセット"},3000);return}clearTimeout(rt);rt=0;b.textContent="🗑 リセット";W=new Set();save();$("weak").checked=false;build()}
function build(){let a=D.filter(d=>sec.value=="all"||d.n.startsWith(sec.value));if($("weak").checked)a=a.filter(d=>W.has(d.n));if($("shuf").checked)a=a.sort(()=>Math.random()-.5);q=a;i=0;render()}
const ph=(d,hide)=>d.p.replace("@",hide?"<b>＿＿＿＿</b>":`<b>${d.form}</b>`);
function render(){shown=false;done=false;const c=$("c");
[0,1,2].forEach(k=>$("t"+k).className=k==mode?"on":"");
if(!q.length){c.innerHTML="<p>該当する単語がありません。</p>";$("p").textContent="";return}
if(i>=q.length){c.innerHTML=`<div class="big">🎉</div><p>全${q.length}語 完了！</p><button class="btn pri" onclick="build()">もう一度</button>`;$("p").textContent="";return}
const d=q[i];$("p").textContent=`${i+1} / ${q.length}　苦手: ${W.size}語`;
if(mode==1){c.innerHTML=`<div class="no">${d.n}</div><div class="big">${d.w}</div><button class="btn" onclick="speak('${d.form}')">🔊 発音を聞く</button><input id="in" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="日本語の意味を書く"><div id="ans"></div><div class="row"><button class="btn pri" id="rv">答えを見る</button></div>`;$("in").onkeydown=e=>{if(e.key=="Enter")reveal()};
$("rv").onclick=reveal;speak(d.w);return}
c.innerHTML=`<div class="no">${d.n}</div>`+(mode==0?`<div class="jp">${d.j}</div><div class="ph">${ph(d,1)}</div>`:`<div class="ph">🔊 聞こえた単語を書こう</div><button class="btn" onclick="speak('${d.w}')">もう一度聞く</button>`)+`<input id="in" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="spelling"><div class="msg" id="m"></div><div class="row"><button class="btn" id="hint">ヒント</button><button class="btn pri" id="ok">答え合わせ</button></div>`;
const inp=$("in");inp.onkeydown=e=>{if(e.key=="Enter")check()};$("ok").onclick=check;
$("hint").onclick=()=>{$("m").className="msg";$("m").textContent="ヒント: "+d.w[0]+" "+"_ ".repeat(d.w.length-1)+`(${d.w.length}文字)`};
if(mode==2)speak(d.w);else inp.focus()}
function reveal(){const d=q[i];if(!shown){shown=true;$("ans").innerHTML=`<div class="jp">${d.j}</div><div class="ph">${ph(d)}</div>`;$("rv").style.display="none";$("c").querySelector(".row").innerHTML='<button class="btn" id="no">もう一度</button><button class="btn pri" id="yes">覚えた</button>';$("no").onclick=()=>{W.add(d.n);save();q.push(d);i++;render()};$("yes").onclick=()=>{W.delete(d.n);save();i++;render()}}}
function check(){const d=q[i];if(done){i++;render();return}const v=$("in").value.trim().toLowerCase(),m=$("m");
if(!v)return;done=true;
if(v==d.w.toLowerCase()||v==d.form.toLowerCase()){m.className="msg ok";m.textContent="⭕ 正解！ "+d.w;W.delete(d.n)}
else{m.className="msg ng";m.innerHTML="❌ 正解: "+d.w;W.add(d.n);q.push(d)}
save();speak(d.form);$("ok").textContent="次へ";$("p").textContent=`${i+1} / ${q.length}　苦手: ${W.size}語`}
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&mode==0||e.key=="Enter"&&mode==2){if(done&&document.activeElement.tagName!="INPUT")check()}});
[0,1,2].forEach(k=>$("t"+k).onclick=()=>{mode=k;build()});
sec.onchange=$("weak").onchange=$("shuf").onchange=build;
build();
</script></body></html>
