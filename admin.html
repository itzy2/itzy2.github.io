
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>解約管理 | GATE SQUARE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#081426;color:#eaf4ff;
 font-family:Arial,"Noto Sans JP",sans-serif
}
header{
 padding:20px;background:#10233d;
 border-bottom:1px solid #294665;
 display:flex;justify-content:space-between;align-items:center;
 gap:12px
}
main{max-width:1100px;margin:25px auto;padding:15px}
.panel{
 background:#10233d;border:1px solid #294665;
 border-radius:14px;padding:20px;margin-bottom:18px
}
h1,h2{margin-top:0}
input,textarea{
 width:100%;padding:12px;margin:7px 0 14px;
 border-radius:8px;border:1px solid #42617e;
 background:#081426;color:white
}
button{
 padding:11px 17px;border:0;border-radius:8px;
 background:#24c8ee;color:#061626;
 font-weight:bold;cursor:pointer;margin:4px
}
button.danger{background:#e65b68;color:white}
button.secondary{background:#294665;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{
 padding:12px;border-bottom:1px solid #294665;text-align:left
}
th{color:#62dafa}
.table-wrap{overflow-x:auto}
.muted{color:#9db3ca;font-size:13px}
.hidden{display:none!important}
#message{padding:12px;color:#71e5a5;white-space:pre-wrap}
#error{color:#ff9292;white-space:pre-wrap}
#result{
 white-space:pre-wrap;overflow-wrap:anywhere;
 line-height:1.8;margin-top:15px
}
.status{color:#71e5a5}
#selected{padding:12px;background:#081426;border-radius:8px}
#printSheet{display:none}

@media(max-width:600px){
 header{padding:14px}
 main{padding:10px;margin:12px auto}
 .panel{padding:14px}
}

@media print{
 @page{size:A4;margin:15mm}
 body{background:white!important;color:#111!important}
 body *{visibility:hidden!important}
 #printSheet,#printSheet *{visibility:visible!important}
 #printSheet{
  display:block!important;
  position:absolute;left:0;top:0;width:100%;
  border:2px solid #222;padding:22px;
  background:white;color:#111;
  font-family:Arial,"Noto Sans JP",sans-serif
 }
 #printSheet h1{
  text-align:center;border-bottom:2px solid #222;
  padding-bottom:12px
 }
 #printSheet table{
  width:100%;border-collapse:collapse;min-width:0
 }
 #printSheet th,#printSheet td{
  border:1px solid #777;padding:10px;color:#111
 }
 #printSheet th{width:28%;background:#eee!important}
 #printSheet .thanks{
  text-align:center;margin-top:35px;font-weight:bold
 }
}
</style>
</head>

<body>

<header>
 <div>
  <b>GATE SQUARE</b>
  <div class="muted">解約管理システム</div>
 </div>
 <button class="secondary" onclick="logout()">ログアウト</button>
</header>

<main>

<section id="loginArea" class="panel">
 <h2>管理者ログイン</h2>

 <label>メールアドレス</label>
 <input id="email" type="email" autocomplete="username">

 <label>パスワード</label>
 <input id="password" type="password" autocomplete="current-password">

 <button id="loginButton" onclick="login()">ログイン</button>
</section>

<section id="adminArea" class="hidden">

 <div class="panel">
  <h2>登録者一覧</h2>
  <p class="muted">解約対象となる会員を選択してください。</p>

  <button onclick="loadUsers()">一覧を更新</button>

  <div class="table-wrap">
   <table>
    <thead>
     <tr>
      <th>会員名</th>
      <th>メール</th>
      <th>オプション</th>
      <th>操作</th>
     </tr>
    </thead>
    <tbody id="users"></tbody>
   </table>
  </div>
 </div>

 <div class="panel">
  <h2>解約処理</h2>

  <div id="selected">
   対象者が選択されていません。
  </div>

  <label>解約内容・備考</label>
  <textarea id="content" rows="4"
   placeholder="解約内容を入力してください"></textarea>

  <button class="danger" onclick="cancelMember()">
   この会員を解約する
  </button>

  <div id="result"></div>
 </div>

 <div class="panel">
  <h2>解約履歴</h2>

  <button onclick="loadHistory()">履歴を更新</button>

  <div class="table-wrap">
   <table>
    <thead>
     <tr>
      <th>解約者</th>
      <th>解約日</th>
      <th>操作</th>
     </tr>
    </thead>
    <tbody id="history"></tbody>
   </table>
  </div>
 </div>

</section>

<div id="message"></div>
<div id="error"></div>

</main>

<!-- 印刷用証明書 -->

<div id="printSheet">
 <h1>GATE SQUARE<br>解約完了証明書</h1>

 <table>
  <tr>
   <th>解約者名</th>
   <td id="pName"></td>
  </tr>
  <tr>
   <th>解約日</th>
   <td id="pDate"></td>
  </tr>
  <tr>
   <th>管理者</th>
   <td>管理者</td>
  </tr>
  <tr>
   <th>解約内容</th>
   <td id="pContent"></td>
  </tr>
  <tr>
   <th>契約オプション</th>
   <td id="pOptions"></td>
  </tr>
  <tr>
   <th>解約金</th>
   <td>なし</td>
  </tr>
  <tr>
   <th>費用負担</th>
   <td>GATE SQUARE負担</td>
  </tr>
 </table>

 <div class="thanks">
  ご利用ありがとうございました。
 </div>

 <p style="text-align:right;margin-top:25px">
  GATE SQUARE
 </p>
</div>

<script>
"use strict";

// Supabase設定
const SUPABASE_URL =
 "https://hxrtpftlklgwesvanlpk.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let selectedUser = null;
let currentUsers = [];
let currentHistory = [];

function el(id){
 return document.getElementById(id);
}

function message(text){
 el("message").textContent = text || "";
 el("error").textContent = "";
}

function showError(text){
 el("error").textContent = text || "不明なエラー";
 el("message").textContent = "";
}

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function asArray(value){
 return Array.isArray(value) ? value : [];
}

function optionNames(options, activeOnly = false){
 return asArray(options)
  .filter(o => !activeOnly || o.status === "active")
  .map(o => o.plan_name || o.plan_code || "オプション");
}

function formatDate(value){
 if(!value) return "";
 const d = new Date(value);
 if(Number.isNaN(d.getTime())) return String(value);
 return d.toLocaleString("ja-JP");
}

// ログイン
async function login(){
 try{
  el("loginButton").disabled = true;
  message("ログインしています...");

  const {data,error} = await db.auth.signInWithPassword({
   email:el("email").value.trim(),
   password:el("password").value
  });

  if(error) throw error;

  if(!data.session){
   throw new Error("ログインセッションを取得できませんでした。");
  }

  el("loginArea").classList.add("hidden");
  el("adminArea").classList.remove("hidden");

  await loadUsers();
  await loadHistory();

 }catch(e){
  showError("ログインエラー：" + e.message);
 }finally{
  el("loginButton").disabled = false;
 }
}

// ログアウト
async function logout(){
 if(!confirm("ログアウトしますか？")) return;

 await db.auth.signOut();
 location.reload();
}

// Edge Function呼び出し
async function callApi(action,extra = {}){
 const {data:sessionData,error:sessionError} =
  await db.auth.getSession();

 if(sessionError) throw sessionError;

 const session = sessionData?.session;

 if(!session){
  throw new Error("ログインしてください。");
 }

 const {data,error} = await db.functions.invoke(
  "gs-cancellation",
  {
   body:{
    action,
    ...extra
   }
  }
 );

 if(error){
  let detail = error.message || "Edge Functionエラー";

  try{
   if(error.context && typeof error.context.json === "function"){
    const responseBody = await error.context.json();
    detail = responseBody.error ||
             responseBody.message ||
             detail;
   }
  }catch(_){}

  throw new Error(detail);
 }

 if(!data){
  throw new Error("サーバーからデータが返されませんでした。");
 }

 if(data.success === false || data.error){
  throw new Error(data.error || "処理に失敗しました。");
 }

 return data;
}

// 会員一覧
async function loadUsers(){
 try{
  message("会員一覧を読み込んでいます...");

  const data = await callApi("list");

  // index.ts の戻り値 members に対応
  currentUsers = asArray(data.members);

  el("users").innerHTML = "";

  if(currentUsers.length === 0){
   el("users").innerHTML =
    '<tr><td colspan="4">登録会員がありません。</td></tr>';
   message("会員一覧を更新しました。");
   return;
  }

  currentUsers.forEach(u=>{
   const opts = optionNames(u.options,true).join("、") || "なし";

   const tr = document.createElement("tr");

   tr.innerHTML = `
    <td>${safe(u.display_name)}</td>
    <td>${safe(u.email)}</td>
    <td>${safe(opts)}</td>
    <td><button class="selectButton">選択</button></td>
   `;

   tr.querySelector("button").addEventListener("click",()=>{
    selectUser(u.id);
   });

   el("users").appendChild(tr);
  });

  message("登録者一覧を更新しました。");

 }catch(e){
  showError("会員一覧エラー：" + e.message);
 }
}

// 会員選択
function selectUser(id){
 selectedUser = currentUsers.find(u=>u.id === id) || null;

 if(!selectedUser){
  message("対象会員が見つかりません。");
  return;
 }

 el("selected").textContent =
  "選択中：" +
  (selectedUser.display_name || "名前未登録") +
  " / " +
  (selectedUser.email || "");

 el("result").textContent = "";
 message("解約対象者を選択しました。");
}

// 解約処理
async function cancelMember(){
 if(!selectedUser){
  showError("対象者を選択してください。");
  return;
 }

 const memberName =
  selectedUser.display_name || selectedUser.email;

 if(!confirm(
  memberName +
  " さんを解約します。\n" +
  "この処理ではパスワードと表示名も変更されます。\n" +
  "よろしいですか？"
 )){
  return;
 }

 try{
  message("解約処理を実行しています...");

  const data = await callApi("cancel",{
   user_id:selectedUser.id,
   cancellation_content:el("content").value
  });

  if(!data.new_password){
   throw new Error(
    "処理結果に新しいパスワードが含まれていません。管理者に確認してください。"
   );
  }

  // 再利用アカウント情報を表示
  el("result").textContent =
   "解約処理が完了しました。\n\n" +
   "解約者名：" + (data.member_name || memberName) + "\n" +
   "メールアドレス：" + (data.email || selectedUser.email) + "\n" +
   "新しい表示名：" + (data.new_name || "") + "\n" +
   "新しいパスワード：" + data.new_password + "\n\n" +
   "このパスワードは一度しか表示されません。\n" +
   "必要な場合は安全な場所に保管してください。";

  // 証明書を準備
  preparePrint({
   name:data.member_name || memberName,
   date:formatDate(data.cancelled_at || new Date()),
   content:data.cancellation_content ||
           el("content").value ||
           "解約手続き",
   options:optionNames(data.options,true)
  });

  // 印刷
  window.print();

  selectedUser = null;

  el("selected").textContent =
   "対象者が選択されていません。";

  el("content").value = "";

  await loadUsers();
  await loadHistory();

  message("解約処理と証明書の作成が完了しました。");

 }catch(e){
  showError("解約エラー：" + e.message);
 }
}

// 印刷内容設定
function preparePrint(item){
 el("pName").textContent = item.name || "";
 el("pDate").textContent = item.date || "";
 el("pContent").textContent = item.content || "解約手続き";

 el("pOptions").textContent =
  asArray(item.options).length
   ? item.options.join("、")
   : "なし";
}

// 解約履歴
async function loadHistory(){
 try{
  const data = await callApi("history");

  currentHistory = asArray(data.history);

  el("history").innerHTML = "";

  if(currentHistory.length === 0){
   el("history").innerHTML =
    '<tr><td colspan="3">解約履歴はありません。</td></tr>';
   return;
  }

  currentHistory.forEach(h=>{
   const tr = document.createElement("tr");

   tr.innerHTML = `
    <td>${safe(h.cancelled_member_name)}</td>
    <td>${safe(formatDate(h.cancelled_at))}</td>
    <td><button class="secondary">書類印刷</button></td>
   `;

   tr.querySelector("button").addEventListener("click",()=>{
    printHistory(h.id);
   });

   el("history").appendChild(tr);
  });

 }catch(e){
  showError("履歴取得エラー：" + e.message);
 }
}

// 過去の解約証明書を印刷
function printHistory(id){
 const h = currentHistory.find(x=>x.id === id);

 if(!h){
  showError("解約履歴が見つかりません。");
  return;
 }

 const options = asArray(h.options_snapshot)
  .filter(o=>o.status === "active")
  .map(o=>o.plan_name || o.plan_code || "オプション");

 preparePrint({
  name:h.cancelled_member_name,
  date:formatDate(h.cancelled_at),
  content:h.cancellation_content || "解約手続き",
  options
 });

 window.print();
}

// ログイン状態の復元
async function initialize(){
 try{
  const {data,error} = await db.auth.getSession();

  if(error) throw error;

  if(data.session){
   el("loginArea").classList.add("hidden");
   el("adminArea").classList.remove("hidden");

   await loadUsers();
   await loadHistory();
  }
 }catch(e){
  showError("初期化エラー：" + e.message);
 }
}

initialize();

</script>
</body>
</html>
